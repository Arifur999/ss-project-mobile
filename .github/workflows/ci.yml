name: CI

# Quality check only. Nothing here deploys: the app reaches phones through EAS
# builds, never through a push, so pushing this repo cannot affect the website
# or the API - those deploy from their own repos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      # Bundles the whole app the way a phone would load it, so a broken import
      # or a missing asset fails here instead of on somebody's device.
      - name: Bundle (Android)
        run: npx expo export --platform android --output-dir /tmp/expo-export
